kind: pipeline
type: docker
name: nova-dsh-model-console

trigger:
  branch:
    - main
  event:
    - push
    - custom

concurrency:
  limit: 1

volumes:
  - name: pnpm-cache
    host:
      path: /var/lib/drone-cache/pnpm/nova-dsh-model-console

steps:
  - name: build and package
    image: node:22-alpine
    volumes:
      - name: pnpm-cache
        path: /cache
    commands:
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      - pnpm config set store-dir /cache/pnpm-store
      - pnpm config set registry https://registry.npmmirror.com/
      - pnpm install --frozen-lockfile
      # prebuild builds the contracts and Casdoor packages, then generates the API.
      - pnpm --filter @nova/model-console run build
      - mkdir -p output/model-console
      - cp -R apps/model-console/dist output/model-console/dist
      - cp scripts/deploy-nova.sh output/model-console/deploy-nova.sh
      - tar -czf model-console.tar.gz -C output/model-console .

  - name: scp
    image: appleboy/drone-scp
    settings:
      debug: false
      source:
        - model-console.tar.gz
      host:
        from_secret: CURRENT_HOST
      username: root
      port: 22
      password:
        from_secret: SSH_PWD
      target: /temp/app/nova-dsh/model-console/${DRONE_BUILD_NUMBER}

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: CURRENT_HOST
      username: root
      password:
        from_secret: SSH_PWD
      port: 22
      command_timeout: 2m
      script:
        - set -eu
        - umask 077
        - RELEASE_DIR=/temp/app/nova-dsh/model-console/${DRONE_BUILD_NUMBER}/release
        - mkdir -p "$RELEASE_DIR"
        - tar -xzf /temp/app/nova-dsh/model-console/${DRONE_BUILD_NUMBER}/model-console.tar.gz -C "$RELEASE_DIR"
        - sh "$RELEASE_DIR/deploy-nova.sh" model-console "$RELEASE_DIR"
        - rm -rf /temp/app/nova-dsh/model-console/${DRONE_BUILD_NUMBER}
