syntax = "proto3";

package nova.execution.v1;

import "google/protobuf/timestamp.proto";
import "runner/v1/common.proto";

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  COMPLETED = 3;
  FAILED = 4;
  CANCELLED = 5;
  TIMED_OUT = 6;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  STDOUT = 1;
  STDERR = 2;
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE = 1;
  DIRECTORY = 2;
  SYMLINK = 3;
}

message Started { int32 pid = 1; }
message Output { OutputStream stream = 1; bytes data = 2; }
message Finished {
  ExecutionStatus status = 1;
  int32 exit_code = 2;
  nova.common.v1.Error error = 3;
  uint64 duration_ms = 4;
}
message ExecutionEvent {
  string execution_id = 1;
  uint64 sequence = 2;
  google.protobuf.Timestamp ts = 3;
  oneof event {
    Started started = 10;
    Output output = 11;
    Finished finished = 12;
  }
}

message FileInfo {
  string path = 1;
  FileKind kind = 2;
  uint64 size = 3;
  int64 mtime = 4;
}
message DirEntry { string name = 1; FileKind kind = 2; }
message ReadTextResult {
  string text = 1;
  uint64 start_line = 2;
  uint64 end_line = 3;
  optional uint64 total_lines = 4;
  uint64 total_size = 5;
  bool truncated = 6;
  bool line_truncated = 7;
}
message GrepMatch {
  string file = 1;
  uint32 line = 2;
  string text = 3;
}
