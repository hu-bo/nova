name: runner-release

on:
  push:
    tags:
      - "runner-v*"

jobs:
  build-linux:
    name: Build linux-x64 (Rocky Linux 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with glibc 2.34
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            rockylinux:9 \
            bash -lc '
              set -euo pipefail
              dnf install -y gcc gcc-c++ make curl perl pkg-config openssl-devel
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source "$HOME/.cargo/env"
              cargo build -p nova-runner --release
            '
      - uses: actions/upload-artifact@v6
        with:
          name: nova-runner-linux-x64
          path: target/release/nova-runner
          if-no-files-found: error

  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-x64, os: macos-15-intel, binary: target/release/nova-runner }
          - { target: darwin-arm64, os: macos-14, binary: target/release/nova-runner }
          - { target: win32-x64, os: windows-latest, binary: target/release/nova-runner.exe }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p nova-runner --release
      - uses: actions/upload-artifact@v6
        with:
          name: nova-runner-${{ matrix.target }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  publish:
    needs: [build-linux, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v6
        with:
          pattern: nova-runner-*
          path: artifacts
          merge-multiple: false
      - name: Stage platform binaries
        shell: bash
        run: |
          set -euo pipefail
          for target in linux-x64 darwin-x64 darwin-arm64; do
            NOVA_RUNNER_BINARY="$PWD/artifacts/nova-runner-$target/nova-runner" \
              NOVA_RUNNER_TARGET="$target" \
              pnpm --dir packages/runner stage
          done
          NOVA_RUNNER_BINARY="$PWD/artifacts/nova-runner-win32-x64/nova-runner.exe" \
            NOVA_RUNNER_TARGET="win32-x64" \
            pnpm --dir packages/runner stage
      - name: Set release version
        shell: bash
        run: npm pkg set "version=${GITHUB_REF_NAME#runner-v}" --prefix packages/runner
      - run: npm publish
        working-directory: packages/runner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
