name: model-gateway-client

on:
  pull_request:
    paths:
      - "apps/model-gateway-client/**"
      - "packages/casdoor/**"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/model-gateway-client/**"
      - "packages/casdoor/**"
      - "pnpm-lock.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nova/model-gateway-client api:check
      - run: pnpm --filter @nova/model-gateway-client test
      - run: pnpm --filter @nova/model-gateway-client build
